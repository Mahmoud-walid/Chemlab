name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: everything that needs no services and no browser. Fails in
  # ~2 minutes, so a formatting slip or a type error does not wait behind a
  # build and a browser download.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run lint
      # Fails when a route ships with no kill switch and no documented reason
      # to be always-open. Filesystem only — no database needed.
      - run: pnpm run pages:check
      # Shuffled, like the integration job. The unit tests share no external
      # state, so the risk is much smaller — but "much smaller" is not
      # "none": a module-level cache or a mutated import leaks between files
      # in whatever order they happen to run, and the only way to find that
      # is to keep changing the order.
      #
      # A dedicated script rather than `pnpm run test:coverage --
      # --sequence.shuffle`. That form appends the flag AFTER a bare `--`,
      # which Vitest reads as the end of its options — so the flag became a
      # positional argument and was silently ignored. The integration job had
      # been "shuffling" that way for weeks without shuffling anything.
      - run: pnpm run test:coverage:shuffle

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      # The same throwaway VAPID pair the e2e job uses. Set here so
      # `pnpm bundle:check` has a real value to grep the built client output
      # for — without one it searches for an empty string and passes for the
      # wrong reason, which is exactly how that guard failed silently once.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BG8yTZes4g1RimvHLRYVAJwFQ3MfzAZmwDdRuMLcHwobhHQSOVHum2QAZQlLwGL00j4DkMPVtd-iMhMTZdxUVIU
      VAPID_PRIVATE_KEY: x3PPHgvu6UeIR3aXt0vqpbw6txVkNcfWxesGePG1TCo
      VAPID_SUBJECT: mailto:ci@chemlab.invalid
      # And the rest of the list `scripts/bundle-check.ts` guards, for exactly
      # the same reason. It skips any name whose value is unset — so with only
      # the VAPID pair set, four of its seven greps did nothing on every run,
      # which is the failure the comment above describes rather than one it
      # prevented.
      #
      # The grep can only find a value this build actually had. The leak it
      # catches is the value reaching a client chunk by any route — a
      # `NEXT_PUBLIC_` prefix typed onto the wrong variable, a server value
      # handed to a client component as a prop, a hardcoded copy — and with
      # the variable unset there is no string to search for, so the check
      # passes without having looked at anything.
      #
      # Throwaway values, none of them real, none of them authenticating
      # anything: they exist to be searched for in a file.
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      GOOGLE_CLIENT_SECRET: ci-only-google-client-secret
      CI_NOTIFY_SECRET: ci-only-notify-secret-at-least-32-characters
      SLACK_WEBHOOK_URL: https://hooks.slack.invalid/services/ci/only/placeholder
      # And the media upload secret, for the same reason: unset, its probe in
      # `bundle:check` searches for an empty string and passes without having
      # looked at anything.
      CLOUDINARY_API_SECRET: ci-only-cloudinary-api-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # Deliberately no DATABASE_URL: the build must keep working without a
      # database, or every pull request depends on one being up. The content
      # routes render on demand instead of prerendering — see
      # db/queries/availability.ts.
      - run: pnpm run build
      # The answer key must not be in the JavaScript a candidate downloads.
      # It needs a build to grep, so it lives here rather than in `pnpm check`.
      - run: pnpm run bundle:check

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pin to the major version Neon runs — testing against a different
        # major would defeat the point of using real Postgres.
        image: postgres:17
        env:
          POSTGRES_USER: chemlab
          POSTGRES_PASSWORD: chemlab
          POSTGRES_DB: chemlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chemlab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://chemlab:chemlab@localhost:5432/chemlab_test
      DATABASE_URL_UNPOOLED: postgres://chemlab:chemlab@localhost:5432/chemlab_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Shuffled so an ordering dependency between tests fails here rather than
      # becoming a mystery flake later.
      # See the note on the unit job: the `-- --sequence.shuffle` form this
      # used to use never reached Vitest.
      - run: pnpm run test:integration:shuffle

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # The pages read their content from Postgres now, so the browser tests need
    # a real, seeded database — not a fixture that can drift from the schema.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chemlab
          POSTGRES_PASSWORD: chemlab
          POSTGRES_DB: chemlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chemlab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://chemlab:chemlab@localhost:5432/chemlab_test
      DATABASE_URL_UNPOOLED: postgres://chemlab:chemlab@localhost:5432/chemlab_test
      # A throwaway value for the account journeys. Not a secret: it signs
      # cookies for one ephemeral runner and is discarded with it. The real one
      # lives in the deployment's environment.
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      # A throwaway VAPID pair, generated once for CI with `pnpm vapid:keys`.
      # The PUBLIC half is public by definition — it is inlined into the client
      # bundle in every deployment. The private half signs nothing that leaves
      # this runner: no push is ever sent here, and the real pair lives in the
      # deployment's environment. It is set anyway so `pnpm bundle:check` has a
      # value to grep the built client output for, which is the only way that
      # guard proves anything in CI.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BG8yTZes4g1RimvHLRYVAJwFQ3MfzAZmwDdRuMLcHwobhHQSOVHum2QAZQlLwGL00j4DkMPVtd-iMhMTZdxUVIU
      VAPID_PRIVATE_KEY: x3PPHgvu6UeIR3aXt0vqpbw6txVkNcfWxesGePG1TCo
      VAPID_SUBJECT: mailto:ci@chemlab.invalid
      # Throwaway Google credentials, so the Google sign-in path EXISTS to be
      # tested. `googleConfigured()` hides the button when either is unset, so
      # without these the journey #13 asks for would silently not run and its
      # "no test calls Google" criterion would pass for no reason.
      #
      # Not secrets, and deliberately not real: `tests/e2e/auth-google.spec.ts`
      # intercepts every request to accounts.google.com, so nothing is ever
      # sent to Google and no value here is ever presented to anybody. What
      # the test checks is the SHAPE of the authorize URL the app builds — the
      # callback origin, the flow, the scopes — which is what actually breaks,
      # and which real credentials would not test any better. Verified by
      # pointing BETTER_AUTH_URL at another origin and watching it fail.
      GOOGLE_CLIENT_ID: ci-only.apps.googleusercontent.invalid
      GOOGLE_CLIENT_SECRET: ci-only-google-client-secret
      # A throwaway HMAC key so the CI-notify tests exercise the SIGNED path.
      # Not the real secret: this one authenticates nothing beyond this
      # runner's own requests to its own localhost, and the deployment's key
      # lives in its environment. Without it those tests skip, and the
      # signature — the only thing standing between that endpoint and the
      # internet — would be tested nowhere.
      CI_NOTIFY_SECRET: ci-only-notify-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # Browsers cached but system deps are not, so install those regardless.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm run env:check
      - run: pnpm run db:migrate
      - run: pnpm run db:seed
      # Field-level, not just counts: a build against a half-seeded database
      # produces pages that render but say the wrong thing.
      - run: pnpm run db:verify
      # Proves the counter triggers survived the migration: a dropped trigger
      # leaves numbers that look fine and are wrong, and nothing else notices.
      - run: pnpm run reconcile
      - run: pnpm run build
      - run: pnpm run test:e2e
      - name: Upload the report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Tells the app what this run did, so a red `main` reaches a phone instead of
  # waiting to be noticed. One job rather than a step in each of the four: five
  # reports for one push is four notifications saying nothing new, and this is
  # the only place that can see the whole run's outcome.
  notify:
    name: notify
    runs-on: ubuntu-latest
    needs: [verify, build, integration, e2e]
    # Runs whatever happened above, including a cancellation — and its own
    # result is never allowed to matter. A monitoring system that can turn a
    # green build red, or mask a red one, is a liability.
    if: >-
      always() &&
      github.event.pull_request.head.repo.fork != true
    continue-on-error: true
    steps:
      - name: Report the run
        # No `-v`, and the response body is not echoed: the secret must not
        # reach a log, and neither must the webhook URL the app holds.
        env:
          CI_NOTIFY_URL: ${{ secrets.CI_NOTIFY_URL }}
          CI_NOTIFY_SECRET: ${{ secrets.CI_NOTIFY_SECRET }}
          # `needs.*.result` is the only place the outcome of a parallel job is
          # visible, and it is exact — no API call, no guessing from logs.
          VERIFY: ${{ needs.verify.result }}
          BUILD: ${{ needs.build.result }}
          INTEGRATION: ${{ needs.integration.result }}
          E2E: ${{ needs.e2e.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # On a `pull_request` event `github.ref_name` is `90/merge` and
          # `github.sha` is the ephemeral merge commit — neither is a thing
          # anybody can check out, and a branch filter matching `90/merge`
          # matches nothing a developer ever watches. `head_ref` and the PR's
          # head sha are the real branch and the real commit.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # `bash`, not the default `bash -e`. GitHub's default shell aborts the
        # step on the first non-zero exit, and every line below is best-effort:
        # a monitoring step that dies because `openssl` was unhappy is a
        # monitoring step that reports nothing and says nothing about why.
        shell: bash
        run: |
          set +e -u

          if [ -z "${CI_NOTIFY_URL:-}" ] || [ -z "${CI_NOTIFY_SECRET:-}" ]; then
            echo "CI notifications are not configured for this repository; skipping."
            exit 0
          fi

          failed=""
          for job in verify build integration e2e; do
            case "$job" in
              verify) result="$VERIFY" ;;
              build) result="$BUILD" ;;
              integration) result="$INTEGRATION" ;;
              e2e) result="$E2E" ;;
            esac
            if [ "$result" = "failure" ]; then
              failed="$failed \"$job\","
            fi
          done
          failed="[${failed%,}]"

          # A cancellation only counts as one when nothing actually failed:
          # a cancelled run that already had a red job is a failure the
          # cancellation happened to interrupt.
          if [ "$failed" != "[]" ]; then
            outcome="failure"
          elif [ "$VERIFY" = "cancelled" ] || [ "$BUILD" = "cancelled" ] || \
               [ "$INTEGRATION" = "cancelled" ] || [ "$E2E" = "cancelled" ]; then
            outcome="cancelled"
          else
            outcome="success"
          fi

          # jq builds the JSON so a commit message containing a quote, a
          # newline or a backslash cannot break the body — or, signed as it
          # would be, turn into a body the app refuses for the wrong reason.
          body=$(jq -cn \
            --arg repository "${{ github.repository }}" \
            --arg branch "$BRANCH" \
            --arg commitSha "$COMMIT_SHA" \
            --arg commitMessage "${COMMIT_MESSAGE:-}" \
            --arg actor "${{ github.actor }}" \
            --arg outcome "$outcome" \
            --argjson failedJobs "$failed" \
            --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg nonce "$(openssl rand -hex 16)" \
            --argjson timestamp "$(date +%s)" \
            --argjson pr "${PR_NUMBER:-null}" \
            '{repository:$repository, branch:$branch, commitSha:$commitSha,
              commitMessage:($commitMessage|split("\n")[0]|.[0:200]),
              actor:$actor, job:"ci", outcome:$outcome, failedJobs:$failedJobs,
              runUrl:$runUrl, nonce:$nonce, timestamp:$timestamp}
             + (if $pr == null then {} else {pullRequestNumber:$pr} end)')

          # HMAC over the RAW body, the same construction GitHub uses for its
          # own webhooks. The secret itself never leaves this runner.
          signature=$(printf '%s' "$body" \
            | openssl dgst -sha256 -hmac "$CI_NOTIFY_SECRET" -hex \
            | awk '{print $NF}')

          status=$(printf '%s' "$body" | curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 10 --retry 2 --retry-connrefused \
            -X POST "$CI_NOTIFY_URL" \
            -H 'content-type: application/json' \
            -H "x-chemlab-signature: sha256=$signature" \
            --data-binary @- || echo "000")

          echo "reported $outcome (failed: $failed) — endpoint answered $status"
          # Deliberately exits 0 whatever the endpoint said. If the app is
          # down or the secret has rotated, CI still reports the true build
          # result.
          exit 0
