name: PR title

# Squash-merging means the PR title becomes the commit message on main, and
# release-please reads those messages to decide the version bump. A mistyped
# type silently produces a release with missing notes, so the title is linted
# here rather than discovered later.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          # Scopes are optional and cosmetic; they only group the changelog.
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" of pull request "{title}" should start with
            a lowercase letter, e.g. "feat(exam): add per-question timer".
